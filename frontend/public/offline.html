// Offline fallback page
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PostalRD Pro - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', -apple-system, sans-serif; 
      background: #F8FAFC; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 24px;
    }
    .container { text-align: center; max-width: 360px; }
    .icon { 
      width: 64px; height: 64px; 
      background: #1E3A8A; 
      border-radius: 16px; 
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
    }
    .icon svg { width: 32px; height: 32px; fill: white; }
    h1 { font-family: 'Manrope', sans-serif; font-size: 24px; color: #0F172A; margin-bottom: 8px; }
    p { color: #64748B; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: #D32F2F; color: white; border: none; 
      padding: 12px 32px; border-radius: 8px; font-size: 14px; font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #C62828; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
    </div>
    <h1>You're Offline</h1>
    <p>PostalRD Pro needs an internet connection to sync your data. Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
